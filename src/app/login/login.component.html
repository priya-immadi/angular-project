<div class="row">
    <div class="col-md-4">
        <form [formGroup]="loginForm" (ngSubmit)="checkLogin()">
            <div class="form-group">
                <label for="" class="form-label">Username</label>
                <input type="text" name="" class="form-control" formControlName="username">
            </div>
            <div class="form-group">
                <label for="" class="form-label">Password</label>
                <input type="password" name="" class="form-control" formControlName="password">
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-success">Login Now</button>
                <button type="submit" class="btn btn-danger">cancel</button>
            </div>


        </form>
    </div>
</div>

<!-- Custom Alert Modal: showModal true unteనే kanipisthundi -->
<div *ngIf="showModal" style="position: absolute; top: 20px; right: 20px; z-index: 1000; width: 300px; background-color: #e1f5fe; border: 2px solid #0288d1; border-radius: 8px; padding: 15px; box-shadow: 0px 4px 10px rgba(0,0,0,0.15);">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <h4 style="margin: 0; color: #0288d1;">🔑 Login Credentials</h4>
    <!-- Close Button (X) -->
    <button (click)="closeModal()" style="background: none; border: none; font-size: 18px; cursor: pointer; color: #555;">❌</button>
  </div>
  
  <div style="font-size: 14px; color: #333; line-height: 1.5;">
    <p style="margin: 5px 0;"><strong>Admin Login:</strong><br>Username: <code style="background:#fff; padding:2px 4px;">admin</code> | Password: <code style="background:#fff; padding:2px 4px;">123</code></p>
    <hr style="border: 0; border-top: 1px solid #b3e5fc; margin: 10px 0;">
    <p style="margin: 5px 0;"><strong>User Login:</strong><br>Username: <code style="background:#fff; padding:2px 4px;">user</code> | Password: <code style="background:#fff; padding:2px 4px;">use123</code></p>
  </div>
</div>
